platform:
  name: RubberCure
  project_id: zxy-73-py
  storage_root: var/state

limits:
  mold:
    max_cavities: 8
    sensor_map_max_age_s: 172800.0
  press:
    fleet_size: 3
    default_thickness_mm: 6.0
    default_product_code: RB-215
  steam:
    target_pressure_kpa: 640.0
    min_pressure_kpa: 80.0
    max_pressure_kpa: 760.0
    safe_residual_kpa: 12.0
    purge_hold_s: 20.0
    purge_token_max_age_s: 180.0
    vent_hold_s: 8.0
    valve_rated_flow_kg_h: 960.0
    trap_rated_flow_kg_h: 240.0
  temp:
    setpoint_c: 151.0
    tolerance_c: 2.0
    warmup_rate_c_per_min: 6.0
    confirm_hold_s: 60.0
    max_cavity_spread_c: 3.0
  timer:
    default_nominal_s: 600.0
    shortfall_ratio: 0.05
    overrun_ratio: 0.08
  cool:
    rated_flow_m3_h: 18.0
    # 仅用于断流/堵管告警；闭环末段流量本来就会自动降到很低
    min_flow_m3_h: 0.5
    alarm_inlet_c: 32.0
    alarm_outlet_c: 48.0
    drain_hold_s: 30.0
    # 调节阀按进出水温差闭环：温差大→开大，温差小→关小
    target_delta_c: 5.0
    # 温差连续低于该值并保持确认时长，判定模具冷透，自动关阀停泵
    stop_delta_c: 1.5
    stop_confirm_s: 20.0
    # 冷却超过此时长仍未冷透则超时告警，交人工处理
    max_cool_s: 1200.0
    # 冷却期间调节阀的最小开度（0 表示末段允许完全关小）
    valve_min_pct: 0.0
    water_specific_heat_kj_kg_k: 4.18
  batch:
    dispatch_window_s: 180.0
    max_queue: 12

pages:
  - press
  - steam
  - timer
  - alarms
